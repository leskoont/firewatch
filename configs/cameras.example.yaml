# Copy to configs/cameras.yaml and edit.

model:
  path: models/firewatch-yolo11s.onnx
  providers: auto          # auto | CPUExecutionProvider | CUDAExecutionProvider
  conf: 0.25
  iou: 0.45

telegram:
  enabled: false
  token: ""
  chat_id: ""

cameras:
  - name: warehouse
    source: rtsp://admin:password@192.168.1.64:554/Streaming/Channels/102
    process_every: 3         # run the model on every 3rd frame
    window: 10               # look at the last 10 processed frames...
    min_hits: 6              # ...and alert if at least 6 of them had a detection
    cooldown_s: 300          # no repeated alerts for this camera for 5 minutes
    reconnect_delay_s: 5
    thresholds:
      fire: 0.40
      smoke: 0.50

  - name: demo-video
    source: data/videos/demo.mp4
    process_every: 2
    enabled: false

  - name: webcam
    source: "0"
    enabled: false
