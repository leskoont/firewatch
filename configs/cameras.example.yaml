# Copy to configs/cameras.yaml and edit. ${VAR} and ${VAR:-default} are taken
# from the environment or from .env in the working directory.

model:
  path: models/firewatch-yolo11s.onnx
  providers: auto          # auto | CPUExecutionProvider | CUDAExecutionProvider
  conf: 0.25               # detector floor; per-camera thresholds below it have no effect
  iou: 0.45
  threads: null            # onnxruntime intra-op threads, null = library default

telegram:
  enabled: ${TELEGRAM_ENABLED:-false}
  token: ${TELEGRAM_BOT_TOKEN:-}
  chat_id: ${TELEGRAM_CHAT_ID:-}

storage:
  dir: events
  snapshots: true
  clips: true
  clip_before_s: 3
  clip_after_s: 5

api:
  enabled: true
  host: 0.0.0.0
  port: 8000

# Merged into every camera; any key can be overridden per camera.
# thresholds are merged per class, `smoke: null` in a camera turns smoke off there.
camera_defaults:
  process_every: 3         # run the model on every 3rd frame
  window: 10               # look at the last 10 processed frames...
  min_hits: 6              # ...and alert if at least 6 of them had a detection
  cooldown_s: 300          # no repeated alerts for the same class and camera for 5 minutes
  reconnect_delay_s: 5
  thresholds:
    fire: 0.40
    smoke: 0.50

# A password with "#", "?" or "/" has to be URL-encoded as %23, %3F and %2F,
# e.g. Pa#ss9 -> Pa%23ss9, otherwise FFmpeg cuts the address at that character.
# Cheap XMEye/Sofia cameras take credentials in the path instead:
#   rtsp://192.168.1.10:554/user=admin_password=xxx_channel=1_stream=0.sdp
# Logs and the API show both forms masked.
cameras:
  - name: warehouse
    source: rtsp://${CAM1_USER}:${CAM1_PASSWORD}@192.168.1.64:554/Streaming/Channels/102

  - name: demo-video
    source: data/videos/demo.mp4
    process_every: 2
    loop: true
    enabled: false

  - name: webcam
    source: "0"
    enabled: false
