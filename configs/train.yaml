# Passed as-is to ultralytics YOLO.train(); any key can be overridden from the
# command line: python scripts/train.py epochs=10 batch=8
model: yolo11s.pt
data: data/dfire/dfire.yaml

epochs: 30
patience: 15
imgsz: 640
# Epochs 1-6 ran with batch 12 and workers 6 and kept going OOM between epochs on
# 6 GB under Windows; 7-30 were resumed with these values and --keep-cuda-cache.
batch: 8
workers: 3
cache: false

optimizer: SGD
lr0: 0.01
cos_lr: true
close_mosaic: 5
seed: 0
deterministic: false

project: runs
name: yolo11s-dfire
exist_ok: false
plots: true
