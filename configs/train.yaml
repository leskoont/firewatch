# Passed as-is to ultralytics YOLO.train(); any key can be overridden from the
# command line: python scripts/train.py epochs=10 batch=8
model: yolo11s.pt
data: data/dfire/dfire.yaml

epochs: 30
patience: 15
imgsz: 640
batch: 12          # ~3 GB with AMP, still went OOM between epochs on 6 GB under Windows, see README
workers: 6
cache: false

optimizer: SGD
lr0: 0.01
cos_lr: true
close_mosaic: 5
seed: 0
deterministic: false

project: runs
name: yolo11s-dfire
exist_ok: false
plots: true
