[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firewatch"
version = "0.1.0"
description = "Fire and smoke detection on video streams with Telegram alerts"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "Maxim" }]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.7",
    "onnxruntime>=1.16",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
train = [
    "ultralytics>=8.3.0",
    "onnx>=1.15",
    "onnxslim>=0.1.30",
    "pyarrow>=14",
    "tqdm",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "onnx>=1.14",
]

[project.scripts]
firewatch = "firewatch.cli:main"

[tool.setuptools.packages.find]
include = ["firewatch*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
