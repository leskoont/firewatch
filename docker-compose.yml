services:
  firewatch:
    build: .
    image: firewatch:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Moscow}
    # the API has no auth, keep it on localhost unless there is a proxy in front
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      # long form, so a missing cameras.yaml is an error and not an empty directory
      - type: bind
        source: ./configs/cameras.yaml
        target: /app/configs/cameras.yaml
        read_only: true
        bind:
          create_host_path: false
      - ./events:/app/events
      - ./data/videos:/app/data/videos:ro
    # /health returns 503 when any camera has sent nothing for a minute; remove with --no-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
