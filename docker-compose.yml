services:
  firewatch:
    build: .
    image: firewatch:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Moscow}
    # the API has no auth, keep it on localhost unless there is a proxy in front
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./configs/cameras.yaml:/app/configs/cameras.yaml:ro
      - ./events:/app/events
      - ./data/videos:/app/data/videos:ro
